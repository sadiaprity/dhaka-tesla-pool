services:
  postgres:
    image: postgres:16-alpine
    container_name: tesla-pg
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: